<!doctype html>
<html lang="et">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/png" href="/favicon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Galerii: Ahjupotitööstus OÜ pottidest ehitatud ahjud, kaminad ja pliidid."/>
    <title>Galerii | Ahjupotitööstus OÜ</title>
</head>
<body>
<!-- site-nav -->

<div class="main-content">
    <div class="container">
        <section>
            <div class="row">
                <div class="col-12 ">
                    <h1>GLASUURPOTT AHJUD</h1>
                </div>
            </div>
            <div id="glazed-slideshow" class="slideshow-container">
                <div class="slides">
                    <div class="slide" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                        <img loading="lazy" src="/glazed/40.jpg" alt="Glasuurpottidest ahi. Projekteerinud M. Ollino, pottsepp V. Kolla.">
                        <div class="slide-title">Projekteerinud M. Ollino, pottsepp V. Kolla.</div>
                    </div>
                </div>
                <div class="slideshow-controls">
                    <button class="arrow-button slideshow-prev">
                        <img class="arrow-left" src="/chevron.svg" alt="scroll carousel to left">
                    </button>

                    <button class="arrow-button slideshow-next">
                        <img class="arrow-right" src="/chevron.svg" alt="scroll carousel to right">
                    </button>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="row">
                <div class="col-12 ">
                    <h1>Lihtpott ahjud</h1>
                </div>
            </div>
            <div id="unglazed-slideshow" class="slideshow-container">
                <div class="slides">
                    <div class="slide" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                        <img loading="lazy" src="/unglazed/L1.jpg" alt="Lihtpottidest ahi. Pottsepp M. Väljamäe.">
                        <div class="slide-title">Pottsepp M. Väljamäe.</div>
                    </div>
                </div>
                <div class="slideshow-controls">
                    <button class="arrow-button slideshow-prev">
                        <img class="arrow-left" src="/chevron.svg" alt="scroll carousel to left">
                    </button>

                    <button class="arrow-button slideshow-next">
                        <img class="arrow-right" src="/chevron.svg" alt="scroll carousel to right">
                    </button>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="row">
                <div class="col-12 ">
                    <h1>Pliidid</h1>
                </div>
            </div>
            <div id="stove-slideshow" class="slideshow-container">
                <div class="slides">
                    <div class="slide" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
                        <img loading="lazy" src="/stove/PL15.jpg" alt="Ahjupottidest pliit. Projekteerinud M. Ollino, pottsepp V. Kolla.">
                        <div class="slide-title">Projekteerinud M. Ollino, pottsepp V. Kolla.</div>
                    </div>
                </div>
                <div class="slideshow-controls">
                    <button class="arrow-button slideshow-prev">
                        <img class="arrow-left" src="/chevron.svg" alt="scroll carousel to left">
                    </button>

                    <button class="arrow-button slideshow-next">
                        <img class="arrow-right" src="/chevron.svg" alt="scroll carousel to right">
                    </button>
                </div>
            </div>
        </section>
    </div>
</div>

<!-- site-footer -->
<script type="module" src="main.js"></script>
</body>
</html>
